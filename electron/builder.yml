appId: com.poseboard.app
productName: 姿态图库
files:
  - electron/**
  - frontend/dist/**
  - package.json
extraResources:
  - from: backend/dist/backend.exe
    to: backend.exe
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
directories:
  output: release
